# If Atlas is ever deployed to Netlify (it is not today; it runs locally, see README).
# Env vars to set in the Netlify UI (never commit them): ATLAS_PASSWORD, ATLAS_SECRET.
[build]
  command = "pnpm build"
  publish = "dist"
  # Free plan hard-pauses on credit exhaustion; only build when Atlas itself changed (paths are relative to the base dir).
  ignore = "[ \"$CACHED_COMMIT_REF\" = \"$COMMIT_REF\" ] && exit 1; git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"

# The service worker must always revalidate or updates never arrive.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
